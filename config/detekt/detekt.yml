# Overrides of detekt's default config only (buildUponDefaultConfig = true).
# Rule names checked against the default config of detekt 2.0.0-alpha.6.

style:
  MaxLineLength:
    # Must match ktlint's max_line_length in .editorconfig.
    maxLineLength: 120
  ForbiddenVoid:
    # WebFlux contracts return Mono<Void> (WebExceptionHandler, BodyInserter); Unit cannot stand in there.
    ignoreUsageInGenerics: true
  MagicNumber:
    # Defaults plus the integrationTest source set (see the note at the end of this file).
    excludes: ['**/test/**', '**/integrationTest/**', '**/*.kts']

# CLAUDE.md: no GlobalScope, never swallow CancellationException. Listed explicitly so an alpha
# that changes a default cannot switch them off.
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

# The default excludes of these rules (and MagicNumber's, above) list `**/test/**` but no `**/integrationTest/**`,
# so backtick test names and literals in the integrationTest source set (ADR-016) would be findings.
complexity:
  TooManyFunctions:
    excludes: ['**/test/**', '**/integrationTest/**']
exceptions:
  InstanceOfCheckForException:
    excludes: ['**/test/**', '**/integrationTest/**']
  ThrowingExceptionsWithoutMessageOrCause:
    excludes: ['**/test/**', '**/integrationTest/**']
  TooGenericExceptionCaught:
    excludes: ['**/test/**', '**/integrationTest/**']
naming:
  FunctionNaming:
    excludes: ['**/test/**', '**/integrationTest/**']
performance:
  ForEachOnRange:
    excludes: ['**/test/**', '**/integrationTest/**']
  SpreadOperator:
    excludes: ['**/test/**', '**/integrationTest/**']
potential-bugs:
  UnsafeCallOnNullableType:
    excludes: ['**/test/**', '**/integrationTest/**']
