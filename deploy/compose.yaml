# Local development stack (FND-02, docs/knowledge/systems/local-stack.md).
# Run from the repository root: docker compose -f deploy/compose.yaml up -d --wait
# Overrides (project name, ports) go in deploy/.env, copied from deploy/.env.example.
# Image tags change here and in test-support's StackImages together (StackContractTest, ADR-FND-02-008).
# Every host port binds 127.0.0.1 from an LLMGW_*_PORT variable whose default is the CLAUDE.md port.
name: llmgw

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-healthcheck-timing: &healthcheck-timing
  interval: 5s
  timeout: 3s
  retries: 30

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: llmgw
      POSTGRES_DB: llmgw
      # A local-only credential on a loopback port, not a secret (ADR-FND-02-002).
      POSTGRES_PASSWORD: ${LLMGW_POSTGRES_PASSWORD:-llmgw}
    ports:
      - "127.0.0.1:${LLMGW_POSTGRES_PORT:-5440}:5432"
    volumes:
      # The 18+ image keeps PGDATA at /var/lib/postgresql/18/docker; the pre-18 path .../data is wrong here.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: the entrypoint's init server listens on the socket only, so it never counts as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "llmgw", "-d", "llmgw"]
      <<: *healthcheck-timing
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  redis:
    image: redis:8.10.3-trixie
    # Soft state by design: no persistence. maxmemory and eviction belong to RL-01 and CACHE-01.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${LLMGW_REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      <<: *healthcheck-timing
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  redpanda:
    # Provisional until COST-02 settles ADR-010.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 1G
      - --default-log-level=warn
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      # The advertised external port must equal the published host port.
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:${LLMGW_KAFKA_PORT:-19092}
    ports:
      - "127.0.0.1:${LLMGW_KAFKA_PORT:-19092}:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      <<: *healthcheck-timing
    deploy:
      resources:
        limits:
          memory: 1536m
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    # No healthcheck: a scratch image has no shell. stack-check.sh proves the pipeline end to end.
    ports:
      - "127.0.0.1:${LLMGW_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${LLMGW_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    environment:
      # The bundled all-in-one config binds localhost without it, unreachable from the collector and the
      # published port. The 2.22.0 image already sets it; kept explicit so an image bump cannot drop it.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${LLMGW_JAEGER_UI_PORT:-16686}:16686"
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.15.1-busybox
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    ports:
      - "127.0.0.1:${LLMGW_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      <<: *healthcheck-timing
    depends_on:
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      # Anonymous Admin on loopback, with the host enforced (below): local convenience, not a pattern for OPS-03.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Loopback does not stop a browser on this machine: a DNS-rebinding page sends Host: <its name>, and with
      # anonymous Admin Grafana would serve it. Enforcing the domain redirects any other Host instead
      # (docs/knowledge/bugs/grafana-anonymous-admin-reachable-through-dns-rebinding.md).
      GF_SERVER_DOMAIN: 127.0.0.1
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SERVER_ROOT_URL: http://127.0.0.1:${LLMGW_GRAFANA_PORT:-3301}/
    ports:
      # 3301, not 3001: Next.js dev servers take 3000 and 3001, and on Docker Desktop a port a Windows process
      # holds does not fail `up` (docs/knowledge/gotchas/docker-desktop-publishes-ports-held-by-windows-processes.md).
      - "127.0.0.1:${LLMGW_GRAFANA_PORT:-3301}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      <<: *healthcheck-timing
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

volumes:
  postgres-data:
  redpanda-data:
  prometheus-data:
  grafana-data:
