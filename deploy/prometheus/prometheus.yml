# Prometheus for the local stack (FND-02, ADR-FND-02-003). No job for the apps: OBS-02 adds one if it scrapes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # The collector's own telemetry, so a drop in the pipeline is itself visible.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  # Metrics received over OTLP, exposed by the collector's prometheus exporter.
  - job_name: otel-collector-exporter
    static_configs:
      - targets: ["otel-collector:8889"]
