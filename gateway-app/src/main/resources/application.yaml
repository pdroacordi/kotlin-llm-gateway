spring:
  application:
    name: gateway-app
  # Reads and writes on the request path; JDBC below runs at startup only (ADR-GW-04-001).
  r2dbc:
    url: r2dbc:postgresql://${LLMGW_POSTGRES_HOST:127.0.0.1}:${LLMGW_POSTGRES_PORT:5440}/${LLMGW_POSTGRES_DB:llmgw}
    username: ${LLMGW_POSTGRES_USER:llmgw}
    password: ${LLMGW_POSTGRES_PASSWORD:}
    # ADR-GW-04-015: the library's defaults set no limit on acquire, create or validation.
    pool:
      initial-size: 2
      # Spares a first request the connect.
      min-idle: 2
      max-size: 10
      max-acquire-time: 500ms
      max-create-connection-time: 2s
      max-validation-time: 250ms
      # A hung peer passes `local`. Costs one round trip, on cache misses only.
      validation-depth: remote
      max-idle-time: 10m
      max-life-time: 30m
  flyway:
    # Seconds, so a hung Postgres fails the start. socketTimeout also bounds each migration statement: raise it for a
    # slower one. pgjdbc's defaults set no limit.
    url: jdbc:postgresql://${LLMGW_POSTGRES_HOST:127.0.0.1}:${LLMGW_POSTGRES_PORT:5440}/${LLMGW_POSTGRES_DB:llmgw}?connectTimeout=5&socketTimeout=${LLMGW_FLYWAY_SOCKET_TIMEOUT:60}
    user: ${LLMGW_POSTGRES_USER:llmgw}
    password: ${LLMGW_POSTGRES_PASSWORD:}
    locations: classpath:db/migration/gateway
  http:
    codecs:
      # The request body limit (ADR-GW-01-008).
      max-in-memory-size: 10MB
  web:
    resources:
      # The gateway serves no static files; otherwise an unknown path is probed as a classpath resource before
      # the 404 (ADR-FND-04-006).
      add-mappings: false
  webflux:
    problemdetails:
      # The default, made explicit: true registers a second error mapper (ADR-FND-04-005).
      enabled: false

server:
  # Loopback by default: TLS is the edge proxy's, and a key on a plain-HTTP bind travels in clear (ADR-GW-04-018).
  address: ${LLMGW_BIND_ADDRESS:127.0.0.1}
  # CLAUDE.md, local ports.
  port: 8080

llmgw:
  server:
    # How long a client's socket may take none of the bytes pending for it, on every response: a stall, not a slow
    # reader. Below stream.idle-timeout, so a stalled client is seen as a client (ADR-GW-02-009).
    client-write-timeout: 30s
  auth:
    # Required: 32 to 512 visible ASCII characters, used as bytes (`openssl rand -base64 32`). Losing it invalidates
    # every key (ADR-GW-04-002).
    hmac-secret: ${LLMGW_KEY_HMAC_SECRET:}
    # Required: same bounds, different from hmac-secret. The credential of /admin (ADR-GW-04-007).
    admin-key: ${LLMGW_ADMIN_KEY:}
    # One store operation, acquire and query together. Positive, at most 10s.
    store-timeout: 1s
    # The whole startup warm-up, attempts included: long enough for a cold JVM. Positive, at most 2m.
    warmup-timeout: 10s
    cache:
      # The revocation lag across replicas. Positive, at most 5m (ADR-GW-04-006).
      ttl: 30s
      # Entries.
      max-size: 10000
      # Positive, at most 1m.
      negative-ttl: 5s
      # Entries.
      negative-max-size: 10000
  providers:
    # Where a model no prefix claims goes; must be enabled. RTE-01 replaces this.
    default-provider: openai
    openai:
      enabled: true
      base-url: https://api.openai.com/v1
      # From the environment only (ADR-GW-01-012).
      api-key: ${OPENAI_API_KEY:}
      connect-timeout: 5s
      # Non-stream only, the whole call: a completion sends nothing until it is done.
      request-timeout: 300s
      # 1KB to 256MB. WebClient's default of 256 KB is too small for n > 1, logprobs or audio.
      max-response-size: 16MB
      pool:
        # A call holds one for its whole duration, and a stream for up to stream.total-timeout, so this is the
        # ceiling on concurrent streams.
        max-connections: 500
        pending-acquire-timeout: 5s
        # At most the server's, or a request meets a connection the server closed.
        max-idle-time: 30s
        # Picks up DNS changes.
        max-life-time: 5m
      stream:
        # Subscribe to the first upstream body byte or error status. No public figure for a reasoning model's first
        # token: chosen generous, and RTE-02 can tighten it per route.
        first-byte-timeout: 120s
        # Between upstream buffers; nginx's proxy_read_timeout default.
        idle-timeout: 60s
        # The whole stream: about 90 000 tokens at an assumed 50 tokens/s.
        total-timeout: 30m
        # 1KB to 16MB, per event. A chunk is usually under 1 KB; streamed audio and logprobs are larger.
        max-event-size: 1MB
      embeddings:
        # The whole call. No public source: 198 MiB at 100 Mbit/s is 17 s, plus the provider's time on 300,000 tokens.
        request-timeout: 120s
        # 1KB to 256MB. The worst valid reply, 2048 x 3072 indented floats, is 198 MiB (ADR-GW-05-006).
        max-response-size: 256MB
        # The cap on concurrent upstream reads. It does not cap memory: a slot is free before the scan and the write.
        max-connections: 64
        # max-in-flight-bytes: request and reply bytes in flight in this process, past which a call gets 503 at once.
        # Unset, a quarter of the heap. Set, at least max-response-size and at most half the heap: heap holds about
        # 2 x this, so size it as (heap - everything else) / 2 (ADR-GW-05-011).
        # What a request with no `dimensions` is priced at: the largest documented output.
        default-dimensions: 3072
        # The bounded scheduler for parsing, scanning and writing bodies, kept off the event loops (ADR-GW-05-012).
        cpu-threads: 4
        # Stages that may wait beyond cpu-threads before a new request's parse gets 503 at once. Later stages are never
        # refused for it: the budget bounds them (ADR-GW-05-012). No public source.
        cpu-queue-size: 256
        # Retry-After on a call refused for the budget, the lane or the pool's queue. No public source.
        busy-retry-after: 5s
    anthropic:
      # Off, so a start with no Anthropic key keeps working (ADR-GW-03-004).
      enabled: false
      # Case-sensitive; removed by RTE-01.
      model-prefixes:
        - claude-
        - mock-claude
      base-url: https://api.anthropic.com/v1
      # From the environment only (ADR-GW-01-012).
      api-key: ${ANTHROPIC_API_KEY:}
      # YYYY-MM-DD. 2026-10-21 removes temperature, top_p and top_k (ADR-GW-03-002).
      version: 2023-06-01
      # Sent when a client names no cap, which the API requires; tokens, this project's judgment (ADR-GW-03-006).
      default-max-tokens: 4096
      connect-timeout: 5s
      request-timeout: 300s
      max-response-size: 16MB
      # Its own values and its own pool: one provider's stall cannot exhaust the other's.
      pool:
        max-connections: 500
        pending-acquire-timeout: 5s
        max-idle-time: 30s
        max-life-time: 5m
      stream:
        first-byte-timeout: 120s
        idle-timeout: 60s
        total-timeout: 30m
        max-event-size: 1MB

logging:
  pattern:
    # MDC keys set by the two filters and the error mapper (GatewayHeaders). `[]` means no team yet.
    correlation: "[%X{requestId:-}] [%X{teamId:-}] "
  level:
    # The error mapper logs every error with the request ID; this adapter would repeat a committed-response error
    # with the raw query string (docs/knowledge/bugs/committed-response-error-logged-twice-with-query-string.md).
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: off

management:
  health:
    r2dbc:
      # Cached keys serve through a Postgres outage, so a load balancer must not pull the replica (ADR-GW-04-005).
      enabled: false
  endpoints:
    web:
      discovery:
        # The links page builds href from the request URI, `;` parameters included, so it can echo a pasted key.
        enabled: false
      exposure:
        include: health
