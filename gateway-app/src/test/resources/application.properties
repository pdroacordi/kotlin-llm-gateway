# Every context needs a key (ADR-GW-01-012). A closed local port as the provider, so a test that reaches the real
# adapter by mistake fails instead of calling api.openai.com (CLAUDE.md: tests never call a real provider).
llmgw.providers.openai.api-key=test-key-not-real
llmgw.providers.openai.base-url=http://127.0.0.1:1/v1
# No Postgres here: migrations off, and a closed port, so a test cannot touch the dev stack (ADR-GW-04-010).
spring.flyway.enabled=false
spring.r2dbc.url=r2dbc:postgresql://127.0.0.1:1/unused
# Fake, and equal to TestKeys.
llmgw.auth.hmac-secret=test-hmac-secret-not-a-real-secret-0001
llmgw.auth.admin-key=test-admin-key-not-a-real-secret-0001
