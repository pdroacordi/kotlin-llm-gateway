# Every version in the build lives here (spec FND-01, ADR-FND-01-001).
# Where Spring Boot also manages a library, the version here must be >= Boot's.
[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
kotlinx-coroutines = "1.11.0"
ktlint = "1.8.0"
ktlint-gradle = "14.2.0"
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
konsist = "0.18.1"
junit = "6.1.3"
mockk = "1.14.11"
# BlockHound publishes its versions with a .RELEASE suffix.
blockhound = "1.0.18.RELEASE"
testcontainers = "2.0.5"
openai-java = "4.98.0"

[libraries]
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-coroutines-bom = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-bom", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core" }
kotlinx-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }
kotlinx-coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
# Versionless: Spring Boot's BOM manages them (gateway-providers applies it as a platform, spec GW-01).
spring-webflux = { module = "org.springframework:spring-webflux" }
spring-context = { module = "org.springframework:spring-context" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
# Versionless: Spring Boot's BOM manages them (GW-04). The driver and Caffeine are for gateway-infra, the starters
# and the Flyway database support for gateway-app.
spring-r2dbc = { module = "org.springframework:spring-r2dbc" }
r2dbc-postgresql = { module = "org.postgresql:r2dbc-postgresql" }
r2dbc-pool = { module = "io.r2dbc:r2dbc-pool" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
spring-boot-starter-r2dbc = { module = "org.springframework.boot:spring-boot-starter-r2dbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
awaitility = { module = "org.awaitility:awaitility" }
# The official SDK, in gateway-app's integrationTest only: a real parser and real exception classes (ADR-GW-01-009).
openai-java = { module = "com.openai:openai-java", version.ref = "openai-java" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
blockhound = { module = "io.projectreactor.tools:blockhound", version.ref = "blockhound" }
blockhound-junit-platform = { module = "io.projectreactor.tools:blockhound-junit-platform", version.ref = "blockhound" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
# Version from testcontainers-bom. Not named `testcontainers`: a prefix of another alias becomes a group
# (docs/knowledge/gotchas/gradle-version-catalog-alias-prefix-needs-asprovider.md).
testcontainers-core = { module = "org.testcontainers:testcontainers" }
# Versionless: Spring Boot's BOM manages them (test-support applies it as a platform, spec FND-02).
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-redpanda = { module = "org.testcontainers:testcontainers-redpanda" }
postgresql = { module = "org.postgresql:postgresql" }
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
snakeyaml = { module = "org.yaml:snakeyaml" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
